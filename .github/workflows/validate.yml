name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          # la licenza è un testo d'uso personale, non una licenza SPDX: HACS la segnala ma non la richiede per i repository personalizzati
          ignore: license

  syntax:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check dist/aurora-casa-3d.js
      - name: La versione è scritta nel file
        run: grep -q "const AC3_VERSION = '" dist/aurora-casa-3d.js
